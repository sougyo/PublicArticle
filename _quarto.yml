project:
  type: website
  output-dir: _site
  render:
    - index.md
    - articles/**/*.md

lang: ja

website:
  title: "数学ノート"
  site-url: https://sougyo.github.io/PublicArticle/
  repo-url: https://github.com/sougyo/PublicArticle
  navbar:
    left:
      - href: index.md
        text: 記事一覧
      - href: articles/category-theory/index.md
        text: 圏論
    right:
      - icon: github
        href: https://github.com/sougyo/PublicArticle
  search: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    toc-title: 目次
    number-sections: true
    html-math-method: mathjax
    link-external-newwindow: true

execute:
  enabled: false
